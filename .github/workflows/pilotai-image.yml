---
# Image of the pilotai branch (Synology NAS, amd64 only).
# Tag pilotai-v<upstream version>.<n>, e.g. pilotai-v2.25.3.1
# -> ghcr.io/david72220/postiz-app:2.25.3-pilotai.1
name: "PilotAI image"

on:
  push:
    tags:
      - 'pilotai-v*'

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image tag
        id: tag
        run: |
          raw="${GITHUB_REF_NAME#pilotai-v}"
          upstream="${raw%.*}"
          n="${raw##*.}"
          echo "image=ghcr.io/david72220/postiz-app:${upstream}-pilotai.${n}" >> "$GITHUB_OUTPUT"
          echo "version=v${upstream}-pilotai.${n}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        run: |
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            -t "${{ steps.tag.outputs.image }}" \
            --build-arg NEXT_PUBLIC_VERSION="${{ steps.tag.outputs.version }}" \
            --label org.opencontainers.image.source=https://github.com/david72220/postiz-app \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --pull --provenance=false --sbom=false \
            --output "type=registry,name=${{ steps.tag.outputs.image }}" .
